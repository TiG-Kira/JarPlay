plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def midletArchivesBaseName

android {
    compileSdk COMPILE_SDK
    ndkVersion NDK_VERSION
    namespace 'com.kira.jarplay'

    defaultConfig {
        applicationId "com.kira.jarplay"
        minSdk MIN_SDK
        targetSdk TARGET_SDK
        versionCode 1
        versionName "1.0.0"
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("D:/KiTerminal-UX/ki-terminal-release.jks")
            storePassword "ki-terminal"
            keyAlias "ki-terminal"
            keyPassword "ki-terminal"
        }
        debug {
            storeFile file("D:/KiTerminal-UX/ki-terminal-release.jks")
            storePassword "ki-terminal"
            keyAlias "ki-terminal"
            keyPassword "ki-terminal"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix '.debug'
            jniDebuggable true
            multiDexEnabled true
            multiDexKeepProguard file('multidex-config.pro')
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        compose true
        buildConfig true
    }

    lint {
        disable 'MissingTranslation', 'ExtraTranslation'
    }

    flavorDimensions 'default'
    productFlavors {
        play {
            buildConfigField 'boolean', 'FULL_EMULATOR', 'true'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro', 'proguard-common.pro'
            versionNameSuffix "-play"
        }
        open {
            buildConfigField 'boolean', 'FULL_EMULATOR', 'true'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro', 'proguard-common.pro'
            versionNameSuffix "-open"
        }
        fdroid {
            buildConfigField 'boolean', 'FULL_EMULATOR', 'true'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro', 'proguard-common.pro'
        }
        dev {
            buildConfigField 'boolean', 'FULL_EMULATOR', 'true'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro', 'proguard-common.pro'
            versionNameSuffix "-dev-" + generateVersionCode()
        }
        midlet {
            buildConfigField 'boolean', 'FULL_EMULATOR', 'false'
            def props = getMidletManifestProperties()
            def midletName = props.getValue('MIDlet-Name').trim()
            def apkName = midletName.replaceAll('[/\\\\:*?\"<>|]', '').replace(' ', '_')
            applicationId "com.example.androidlet.${apkName.toLowerCase()}"
            versionName = props.getValue('MIDlet-Version')
            midletArchivesBaseName = apkName
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-midlet.pro', 'proguard-common.pro'
        }
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = false
        }
        abi {
            enableSplit = true
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/cpp/Android.mk'
        }
    }
}

// Post-build step: realign ALL .so files to 16KB page size for Android 16KB compatibility.
// This is necessary because third-party libraries (mobile-ffmpeg, mididriver, etc.)
// have been compiled with 4KB alignment and fail the VIC 16KB alignment check.
androidComponents {
    onVariants(selector().all()) { variant ->
        def variantName = variant.name
        def realignTaskName = "realign${variantName.capitalize()}SoFor16Kb"
        def mergeTaskName = "merge${variantName.capitalize()}NativeLibs"
        def packageTaskName = "package${variantName.capitalize()}"

        tasks.register(realignTaskName) {
            dependsOn(mergeTaskName)
            doLast {
                def ndkDir = null
                def ndkVersion = NDK_VERSION
                def sdkDir = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
                if (sdkDir) {
                    def versionDir = new File(sdkDir, "ndk/${ndkVersion}")
                    if (versionDir.exists()) {
                        ndkDir = versionDir.absolutePath
                    } else {
                        def ndkVersionsDir = new File(sdkDir, "ndk")
                        if (ndkVersionsDir.exists()) {
                            def dirs = ndkVersionsDir.listFiles()
                            if (dirs != null && dirs.length > 0) {
                                ndkDir = dirs[0].absolutePath
                            }
                        }
                    }
                }
                if (!ndkDir) {
                    logger.warn("Could not find NDK directory, skipping 16KB realignment")
                    return
                }

                def llvmAlign = "${ndkDir}/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-align.exe"
                if (!new File(llvmAlign).exists()) {
                    def altPath = "${ndkDir}/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-align"
                    if (new File(altPath).exists()) llvmAlign = altPath
                }
                if (!new File(llvmAlign).exists()) {
                    logger.warn("llvm-align not found at ${llvmAlign}, trying llvm-objcopy fallback...")
                    llvmAlign = "${ndkDir}/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-objcopy.exe"
                    def altObj = "${ndkDir}/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-objcopy"
                    if (new File(altObj).exists()) llvmAlign = altObj
                    if (!new File(llvmAlign).exists()) {
                        logger.warn("No alignment tool found, skipping 16KB realignment")
                        return
                    }
                }

                def libsDir = "${buildDir}/intermediates/merged_native_libs/${variantName}/${mergeTaskName}/out"
                def libsFile = new File(libsDir)
                if (!libsFile.exists()) {
                    logger.warn("Merged native libs directory not found at ${libsDir}, skipping 16KB realignment")
                    return
                }

                int realignedCount = 0
                int skippedCount = 0
                libsFile.eachFileRecurse(groovy.io.FileType.FILES) { soFile ->
                    if (!soFile.name.endsWith(".so")) return

                    def tmpFile = new File(soFile.parentFile, soFile.name + ".16k")
                    try {
                        def stdout = new ByteArrayOutputStream()
                        def stderr = new ByteArrayOutputStream()
                        exec {
                            executable llvmAlign
                            if (llvmAlign.contains("llvm-align")) {
                                args ["--value=16384", soFile.absolutePath, tmpFile.absolutePath]
                            } else {
                                args ["-z", "max-page-size=16384", soFile.absolutePath, tmpFile.absolutePath]
                            }
                            standardOutput = stdout
                            errorOutput = stderr
                            ignoreExitValue = true
                        }
                        if (tmpFile.exists() && tmpFile.length() > 0) {
                            soFile.delete()
                            tmpFile.renameTo(soFile)
                            realignedCount++
                        } else {
                            logger.warn("Failed to realign ${soFile.name}: ${stderr.toString()}")
                            if (tmpFile.exists()) tmpFile.delete()
                            skippedCount++
                        }
                    } catch (Exception e) {
                        logger.warn("Error realigning ${soFile.name}: ${e.message}")
                        if (tmpFile.exists()) tmpFile.delete()
                        skippedCount++
                    }
                }

                if (realignedCount > 0) {
                    logger.lifecycle("Realigned ${realignedCount} .so files for 16KB compatibility (skipped: ${skippedCount})")
                } else {
                    logger.lifecycle("No .so files needed realignment (checked ${skippedCount + realignedCount} files)")
                }
            }
        }

        // Wire up dependency lazily so the package task exists by the time we configure it
        tasks.configureEach {
            if (it.name == packageTaskName) {
                it.dependsOn realignTaskName
            }
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def flavorName = variant.productFlavors.isEmpty() ? "" : variant.productFlavors[0].first
        def baseName = flavorName == 'midlet' ? "${midletArchivesBaseName}-" : "${rootProject.name}-"
        variant.outputs.each { output ->
            output.outputFileName.set("${baseName}${variant.name}.apk"
                    .replaceAll('--+', '-').replaceAll(' +', '_'))
        }
    }
}

static def generateVersionCode() {
    try {
        def result = "git rev-list HEAD --count".execute().text.trim()
        return result.toInteger()
    } catch (Exception e) {
        return 1
    }
}

def getMidletManifestProperties() {
    def file = project.file('src/midlet/resources/MIDLET-META-INF/MANIFEST.MF')
    def mf = new java.util.jar.Manifest()
    if (file.exists()) {
        def is = null
        try {
            is = new FileInputStream(file)
            mf.read(is)
        } finally {
            if (is != null) is.close()
        }
    }
    return mf.mainAttributes
}

