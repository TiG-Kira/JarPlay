name: 编译 (Debug)

# 每次推送到 main 或提交 PR 时编译 openDebug 做冒烟验证。
# Debug 使用 Android 默认调试签名，不依赖 jks，PR / fork 也能正常编译。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 安装 Android SDK 命令行工具
        run: |
          set -e
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: 安装编译依赖（SDK 平台 / Build-Tools / NDK）
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          # API 37 正式版采用新命名（android-37.0）；AGP 仍按旧 hash string 查找目录 android-37
          sdkmanager "platforms;android-37.0" "build-tools;35.0.0" "ndk;22.1.7171670"
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            sdkmanager --channel=3 "platforms;android-37" >/dev/null 2>&1 || true
          fi
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            echo "::warning::canary 通道无 android-37，复制 android-37.0 为 android-37 以满足 AGP"
            cp -a "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
            # 把副本 package.xml 的 localPackage path 改为 android-37，避免旧式扫描判定 location 不一致而拒收
            sed -i 's|<localPackage path="platforms;android-37.0"|<localPackage path="platforms;android-37"|' \
              "$ANDROID_HOME/platforms/android-37/package.xml"
          fi

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 编译 openDebug APK
        run: |
          ./gradlew :app:assembleOpenDebug --build-cache --console=plain
