name: 编译 (Debug)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Windows runner：构建链路（AGP 9.1 / NDK 22.1 / 新 compileSdk DSL）已在 Windows 本地验证通过。
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 安装编译依赖（SDK 平台 / Build-Tools / NDK）
        shell: bash
        run: |
          set -e
          SDK="$(cygpath "$ANDROID_HOME")"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager.bat"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          # AGP 9.1 采用新命名 API 37.0（见根 build.gradle 的
          # compileSdk { version = release(37) { minorApiLevel = 0 } }），
          # 直接安装原生 platforms;android-37.0，无需 rename/伪造元数据。
          "$SDKM" --sdk_root="$SDK" "platforms;android-37.0" platform-tools "build-tools;36.0.0" "ndk;22.1.7171670"

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-win-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-win-

      - name: 编译 openDebug APK（冒烟）
        shell: bash
        run: ./gradlew :app:assembleOpenDebug --build-cache --console=plain

      - name: 上传 Debug APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: JarPlay-openDebug
          path: app/build/outputs/apk/open/debug/*.apk
