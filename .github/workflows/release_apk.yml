name: 发布 APK 到 Release

# 触发：① 在 GitHub 创建/发布 Release 时自动打包并挂到该 Release；
#       ② 手动 workflow_dispatch（可指定 tag）。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要附加 APK 的 Release tag（手动触发时留空则使用默认分支最新提交）"
        required: false
        type: string

# 同一 tag 的发布构建串行化：不取消进行中的运行，避免 Release 上只挂了一半架构的包。
concurrency:
  group: release-apk-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

# 【安全】签名材料全部从 Secrets 注入，本文件绝不出现明文。
# 需要的仓库 Secrets：
#   JKS_BASE64                    release 私钥库的 base64（必填）
#   KI_TERMINAL_STORE_PASSWORD    密钥库口令（必填，值为 ki-terminal）
#   KI_TERMINAL_KEY_PASSWORD      私钥口令（必填，值为 ki-terminal）
#   KI_TERMINAL_KEY_ALIAS         alias（可选，缺省回落到 ki-terminal）
# 这些变量与 app/build.gradle 的 signingConfigs.release 一一对应。
env:
  KI_TERMINAL_STORE_PASSWORD: ${{ secrets.KI_TERMINAL_STORE_PASSWORD }}
  KI_TERMINAL_KEY_PASSWORD: ${{ secrets.KI_TERMINAL_KEY_PASSWORD }}
  KI_TERMINAL_KEY_ALIAS: ${{ secrets.KI_TERMINAL_KEY_ALIAS }}
  # CI 内将 JKS 解码到 app/ 目录下的相对文件名（与 app/build.gradle 的 KEYSTORE_FILE 默认值对齐）
  KEYSTORE_FILE: ki-terminal-release.jks

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 安装 Android SDK 命令行工具
        run: |
          set -e
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: 安装编译依赖（SDK 平台 / Build-Tools / NDK）
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          # API 37 正式版采用新命名（android-37.0）；AGP 仍按旧 hash string 查找目录 android-37
          sdkmanager "platforms;android-37.0" "build-tools;35.0.0" "ndk;22.1.7171670"
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            sdkmanager --channel=3 "platforms;android-37" >/dev/null 2>&1 || true
          fi
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            echo "::warning::canary 通道无 android-37，复制 android-37.0 为 android-37 以满足 AGP"
            cp -a "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: 解码 JKS 私钥到 app 目录
        env:
          JKS_BASE64: ${{ secrets.JKS_BASE64 }}
        run: |
          set -e
          echo "$JKS_BASE64" | base64 -d > app/ki-terminal-release.jks
          test -s app/ki-terminal-release.jks
          echo "JKS 已写入：$(stat -c%s app/ki-terminal-release.jks) 字节"

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 编译 openRelease APK（增量优先）
        run: |
          ./gradlew :app:assembleOpenRelease --build-cache --console=plain

      - name: 列出产物
        run: ls -lh app/build/outputs/apk/open/release/

      - name: 上传 APK 到 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$tag" ]; then
            echo "::error::无法确定目标 Release tag"
            exit 1
          fi
          shopt -s nullglob
          apks=(app/build/outputs/apk/open/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::未找到 APK 产物"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "上传 $(basename "$apk") ..."
            gh release upload "$tag" "$apk" --clobber
          done
