name: 发布 APK 到 Release

# 触发：① 在 GitHub 创建/发布 Release 时自动打包并挂到该 Release；
#       ② 手动 workflow_dispatch（可指定 tag）。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要附加 APK 的 Release tag（手动触发时留空则使用默认分支最新提交）"
        required: false
        type: string

# 同一 tag 的发布构建串行化。
concurrency:
  group: release-apk-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    # Windows runner：构建链路（AGP 9.1 / NDK 22.1 / 新 compileSdk DSL）已在 Windows 本地验证通过。
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 安装编译依赖（SDK 平台 / Build-Tools / NDK）
        shell: bash
        run: |
          set -e
          SDK="$(cygpath "$ANDROID_HOME")"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager.bat"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          # AGP 9.1 采用新命名 API 37.0（见根 build.gradle 的
          # compileSdk { version = release(37) { minorApiLevel = 0 } }），
          # 直接安装原生 platforms;android-37.0，无需 rename/伪造元数据。
          "$SDKM" --sdk_root="$SDK" "platforms;android-37.0" platform-tools "build-tools;36.0.0" "ndk;22.1.7171670"
      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-win-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-win-

      - name: 解码 JKS 私钥到 app 目录
        shell: bash
        env:
          JKS_BASE64: ${{ secrets.JKS_BASE64 }}
        run: |
          set -e
          echo "$JKS_BASE64" | base64 -d > app/ki-terminal-release.jks
          test -s app/ki-terminal-release.jks
          echo "JKS 已就绪"

      - name: 编译 openRelease APK
        shell: bash
        env:
          KEYSTORE_FILE: ki-terminal-release.jks
        run: |
          set -e
          ./gradlew :app:assembleOpenRelease --build-cache --console=plain
      - name: 列出产物
        shell: bash
        run: ls -lh app/build/outputs/apk/open/release/

      - name: 上传 APK 到 Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$tag" ]; then
            echo "::error::无法确定目标 Release tag"
            exit 1
          fi
          shopt -s nullglob
          apks=(app/build/outputs/apk/open/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::未找到 APK 产物"
            exit 1
          fi
          gh release upload "$tag" "${apks[@]}" --clobber
